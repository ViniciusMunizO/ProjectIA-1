# Render Blueprint for the Sistema VMO API.
#
# Usage: on Render, "New +" -> "Blueprint" -> select this repo. Render reads
# this file and proposes the service below; you'll be prompted to fill in
# every env var marked `sync: false` (nothing secret is stored in the repo).
#
# After the first deploy, copy the service's public URL (something like
# https://sistema-vmo-server.onrender.com) — the frontend needs it as
# VITE_API_URL (see .github/workflows/deploy-pages.yml), and CORS_ORIGIN
# below needs the frontend's GitHub Pages URL in return.
services:
  - type: web
    name: sistema-vmo-server
    runtime: node
    plan: free
    # No rootDir: shared/ has no package.json of its own, so server's build
    # needs the *repo root's* node_modules too (zod, poku) — same reason
    # the GitHub Pages workflow installs at the root before building
    # meu-projeto. Keeping the build anchored at the actual repo root and
    # using --prefix avoids relying on however Render's rootDir scopes the
    # checkout.
    buildCommand: npm install && npm install --prefix server && npm run build --prefix server
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: SESSION_IDLE_TIMEOUT_HOURS
        value: "2"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
